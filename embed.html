<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- PRE-LAUNCH: remove this line at launch so search engines can index the page -->
<meta name="robots" content="noindex, nofollow">
<title>Graphic Design at Sheffield Hallam</title>
<style>
/* ── 1. Tokens ─────────────────────────────────────────── */
:root {
  --bg:        #f3f1ed;
  --surface:   #ffffff;
  --band:      #e8e5e0;   /* version colour — shared with GD Digest nav */
  --border:    #dcd8d1;
  --text:      #1a1918;
  --soft:      #555250;
  --muted:     #807c77;
  --accent:    #1a1918;
  --on-accent: #f3f1ed;
  --maxw:      1180px;
  --gutter:    clamp(16px, 4vw, 40px);

  --col-student-work:  #2563eb;
  --col-live-brief:    #b45309;
  --col-collaboration: #7c3aed;
  --col-alumni:        #047857;
  --col-staff:         #0e7490;
  --col-event:         #be185d;
  --col-award:         #a16207;
  --col-press:         #475569;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0c0c; --surface: #151515; --band: #1c1c1c; --border: #2a2a2a;
    --text: #e3e0da; --soft: #bdb9b3; --muted: #9f9c98;
    --accent: #e8e5e0; --on-accent: #0c0c0c;
    --col-student-work: #5b9cf6; --col-live-brief: #fbbf24; --col-collaboration: #a78bfa;
    --col-alumni: #34d399; --col-staff: #22d3ee; --col-event: #f472b6;
    --col-award: #facc15; --col-press: #94a3b8;
  }
}

/* ── 2. Reset / base ───────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
img { display: block; max-width: 100%; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
.eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted);
}
section { padding: clamp(48px, 8vw, 96px) 0; border-top: 1px solid var(--border); }
.section-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.section-head h2 { font-size: clamp(24px, 3.2vw, 34px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }

/* ── 3. Top bar ────────────────────────────────────────── */
#topbar {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
#topbar .wrap { display: flex; align-items: center; gap: 20px; height: 52px; }
#topbar .brand { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; text-decoration: none; white-space: nowrap; }
#topbar nav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
#topbar nav::-webkit-scrollbar { display: none; }
#topbar nav a {
  font-size: 12.5px; font-weight: 500; color: var(--soft); text-decoration: none;
  padding: 6px 10px; border-radius: 99px; white-space: nowrap;
}
#topbar nav a:hover { background: var(--band); color: var(--text); }
#topbar nav a.cta { background: var(--accent); color: var(--on-accent); }

/* ── 4. Hero ───────────────────────────────────────────── */
#hero { border-top: 0; padding-top: clamp(56px, 10vw, 120px); }
#hero h1 {
  font-size: clamp(38px, 7vw, 88px); font-weight: 800; letter-spacing: -0.035em;
  line-height: 0.98; max-width: 16ch; margin: 14px 0 28px;
}
#hero .lede { font-size: clamp(17px, 1.6vw, 20px); color: var(--soft); max-width: 58ch; }
#hero .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 32px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
  padding: 0 20px; border-radius: 99px; font-size: 14px; font-weight: 600;
  text-decoration: none; border: 1px solid var(--accent);
}
.btn.solid { background: var(--accent); color: var(--on-accent); }
.btn.ghost { color: var(--text); }
.btn:hover { opacity: 0.85; }
#glance {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1px; background: var(--border); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; margin-top: clamp(40px, 6vw, 72px);
}
#glance div { background: var(--surface); padding: 18px 20px; }
#glance dt { margin-bottom: 6px; }
#glance dd { font-size: 15px; font-weight: 500; }

/* ── 5. Activity ───────────────────────────────────────── */
#filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
.pill {
  font: inherit; font-size: 12.5px; font-weight: 500; color: var(--soft);
  background: transparent; border: 1px solid var(--border); border-radius: 99px;
  padding: 6px 14px; min-height: 34px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tc, var(--muted)); }
.pill:hover { border-color: var(--soft); }
.pill.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pill .n { font-variant-numeric: tabular-nums; opacity: 0.6; font-size: 11px; }

#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden; display: flex; flex-direction: column;
  transition: transform .15s ease, border-color .15s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--soft); }
.card-media { aspect-ratio: 4 / 3; background: var(--band); overflow: hidden; position: relative; }
.card-media img { width: 100%; height: 100%; object-fit: cover; }
.card-media.empty {
  display: flex; align-items: flex-end; padding: 16px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--tc) 22%, var(--band)), var(--band));
}
.card-media.empty span { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.9; color: color-mix(in srgb, var(--tc) 70%, var(--text)); opacity: .55; }
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--tc);
}
.badge-sample {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  border: 1px dashed var(--muted); color: var(--muted); border-radius: 4px; padding: 1px 5px;
}
.date { font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.card h3 { font-size: 17px; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
.card .meta { font-size: 12.5px; color: var(--muted); }
.card .desc { font-size: 14px; color: var(--soft); }
.card .links { margin-top: auto; padding-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
.card .links a { font-size: 13px; font-weight: 600; text-underline-offset: 3px; }
#more-wrap { text-align: center; margin-top: 28px; }
.empty-note { color: var(--muted); font-size: 14px; }

/* ── 6. Upcoming ───────────────────────────────────────── */
#upcoming-list { list-style: none; border-top: 1px solid var(--border); }
.up-row {
  display: grid; grid-template-columns: 88px 1fr auto; gap: 20px; align-items: start;
  padding: 22px 0; border-bottom: 1px solid var(--border);
}
.up-date { line-height: 1; }
.up-date .d { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; display: block; }
.up-date .m { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.up-main h3 { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; margin-bottom: 4px; }
.up-main .meta { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.up-main .desc { font-size: 14.5px; color: var(--soft); max-width: 62ch; }

/* ── 7. Audience panels ────────────────────────────────── */
#audiences { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.panel { border-radius: 14px; padding: clamp(28px, 4vw, 44px); display: flex; flex-direction: column; gap: 16px; }
.panel.study { background: var(--band); }
.panel.work  { background: var(--accent); color: var(--on-accent); }
.panel.work .eyebrow { color: color-mix(in srgb, var(--on-accent) 65%, transparent); }
.panel h2 { font-size: clamp(26px, 3.4vw, 38px); font-weight: 750; letter-spacing: -0.025em; line-height: 1.05; }
.panel p { font-size: 15.5px; opacity: .85; max-width: 46ch; }
.panel .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; }
.panel.work .btn { border-color: var(--on-accent); color: var(--on-accent); }
.panel.work .btn.solid { background: var(--on-accent); color: var(--accent); }

footer { border-top: 1px solid var(--border); padding: 28px 0 40px; font-size: 12.5px; color: var(--muted); }
footer .wrap { display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }

/* ── 8. Small screens ──────────────────────────────────── */
@media (max-width: 640px) {
  #topbar nav a:not(.cta) { display: none; }
  #grid { grid-template-columns: 1fr; }
  .up-row { grid-template-columns: 64px 1fr; gap: 14px; }
  .up-row .btn { grid-column: 2; justify-self: start; }
  .up-date .d { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .card { transition: none; } }
</style>
</head>
<body>
<header id="topbar"><div class="wrap">
  <a class="brand" href="#hero">Graphic Design · SHU</a>
  <nav aria-label="Sections">
    <a href="#activity">On the course</a>
    <a href="#upcoming">Upcoming</a>
    <a href="#study">Study</a>
    <a href="#work" class="cta">Work with us</a>
  </nav>
</div></header>

<main>
  <section id="hero"><div class="wrap">
    <p class="eyebrow">BA (Hons) Graphic Design · Sheffield Hallam University</p>
    <h1 id="headline"></h1>
    <p class="lede" id="lede"></p>
    <div class="hero-actions">
      <a class="btn solid" href="#activity">See what's happening</a>
      <a class="btn ghost" href="#upcoming">Visit us</a>
    </div>
    <dl id="glance"></dl>
  </div></section>

  <section id="activity"><div class="wrap">
    <div class="section-head"><h2>On the course</h2><span class="eyebrow" id="act-count"></span></div>
    <div id="filters" role="group" aria-label="Filter by type"></div>
    <div id="grid"></div>
    <div id="more-wrap"></div>
  </div></section>

  <section id="upcoming"><div class="wrap">
    <div class="section-head"><h2>Upcoming</h2><span class="eyebrow">Open days, shows, talks</span></div>
    <ul id="upcoming-list"></ul>
  </div></section>

  <section id="join"><div class="wrap">
    <div id="audiences">
      <div class="panel study" id="study"></div>
      <div class="panel work" id="work"></div>
    </div>
  </div></section>
</main>

<footer><div class="wrap"><span id="foot"></span><span id="updated"></span></div></footer>

<script>
// ── Constants ────────────────────────────────────────────
const TYPES = {
  'student-work':  'Student work',
  'live-brief':    'Live brief',
  'collaboration': 'Collaboration',
  'alumni':        'Alumni',
  'staff':         'Staff',
  'event':         'Event',
  'award':         'Award',
  'press':         'Press',
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PAGE = 9;
const SEP = ' · ';

// ── State ────────────────────────────────────────────────
const S = { page: {}, activity: [], upcoming: [], type: 'all', shown: PAGE, updated: '' };

// ── Helpers ──────────────────────────────────────────────
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s) {
  return esc(s)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '$1');
}
const typeKey = t => t.trim().toLowerCase().replace(/\s+/g, '-');
const typeLabel = k => TYPES[k] || k.replace(/-/g, ' ');
const tc = k => `var(--col-${k}, var(--muted))`;
function parseDate(s) {           // "DD MM·YY"
  const m = s.trim().match(/^(\d{1,2})\s+(\d{1,2})·(\d{2})$/);
  return m ? new Date(2000 + +m[3], +m[2] - 1, +m[1]) : null;
}
const fmtDate = d => d ? `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : '';

// ── Parser ───────────────────────────────────────────────
function splitSections(md) {
  const out = {}; let cur = '_top';
  out[cur] = [];
  for (const line of md.split('\n')) {
    const h = line.match(/^## (.+)$/);
    if (h) { cur = h[1].trim().toLowerCase(); out[cur] = []; continue; }
    out[cur].push(line);
  }
  return out;
}
function parseProse(lines) {
  const paras = [], links = []; let meta = {};
  let buf = [];
  const flush = () => { if (buf.length) { paras.push(buf.join(' ')); buf = []; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l || l === '---' || l.startsWith('<!--') || l.startsWith('>')) { flush(); continue; }
    const kv = l.match(/^\*([A-Za-z ]+):\s*(.+)\*$/);
    if (kv) { flush(); meta[kv[1].toLowerCase()] = kv[2]; continue; }
    const li = l.match(/^- \[([^\]]+)\]\(([^)]+)\)$/);
    if (li) { flush(); links.push({ text: li[1], url: li[2] }); continue; }
    if (l.startsWith('- ')) { flush(); paras.push(l.slice(2)); continue; }
    buf.push(l);
  }
  flush();
  return { paras, links, meta };
}
function parseEntries(lines, section) {
  const entries = []; let e = null;
  for (const raw of lines) {
    const l = raw.trim();
    if (l.startsWith('### ')) {
      const parts = l.slice(4).split(SEP);
      if (parts.length >= 3) {
        e = { date: parseDate(parts[0]), type: typeKey(parts[1]), title: parts.slice(2).join(SEP).trim(),
              meta: {}, tags: [], image: '', desc: [], links: [], section };
        entries.push(e);
      }
      continue;
    }
    if (!e) continue;
    if (l === '---') { e = null; continue; }
    const img = l.match(/^\*Image:\s*(\S+)\*$/);
    if (img) { e.image = img[1]; continue; }
    if (/^\*Type:/.test(l)) {
      l.replace(/^\*|\*$/g, '').split(SEP).forEach(p => {
        const i = p.indexOf(':'); if (i < 0) return;
        const k = p.slice(0, i).trim().toLowerCase(), v = p.slice(i + 1).trim();
        if (k === 'tags') e.tags = [...v.matchAll(/`([^`]+)`/g)].map(m => m[1]);
        else if (k === 'type') e.type = typeKey(v);
        else e.meta[k] = v;
      });
      continue;
    }
    const lk = [...l.matchAll(/\[([^\]]+)\]\(([^)\s]+)\)/g)];
    if (lk.length && l.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '').replace(/[·\s|]/g, '') === '') {
      lk.forEach(m => e.links.push({ text: m[1], url: m[2] })); continue;
    }
    if (l) e.desc.push(l);
  }
  entries.forEach(x => x.sample = x.tags.includes('sample'));
  return entries;
}
function parse(md) {
  const sec = splitSections(md);
  const intro = parseProse(sec['intro'] || []);
  const glance = (sec['at a glance'] || [])
    .map(l => l.trim().match(/^- (.+?)\s*\|\s*(.+)$/)).filter(Boolean).map(m => ({ k: m[1], v: m[2] }));
  const all = [...parseEntries(sec['activity'] || [], 'activity'), ...parseEntries(sec['upcoming'] || [], 'upcoming')];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  // Upcoming entries whose date has passed drop into the activity feed automatically
  S.upcoming = all.filter(e => e.section === 'upcoming' && e.date && e.date >= today).sort((a, b) => a.date - b.date);
  S.activity = all.filter(e => !S.upcoming.includes(e)).sort((a, b) => (b.date || 0) - (a.date || 0));
  S.page = { intro, glance, study: parseProse(sec['study with us'] || []), work: parseProse(sec['work with us'] || []) };
  const foot = md.match(/^\*Footer:\s*(.+)\*$/m);
  S.page.footer = foot ? foot[1].replace(/\s*·?\s*Updated \[auto\]/, '') : '';
}

// ── Render ───────────────────────────────────────────────
function renderHero() {
  const { intro, glance } = S.page;
  document.getElementById('headline').textContent = intro.meta.headline || 'Graphic Design at Sheffield Hallam';
  document.getElementById('lede').innerHTML = intro.paras.map(inline).join(' ');
  document.getElementById('glance').innerHTML = glance.map(g =>
    `<div><dt class="eyebrow">${esc(g.k)}</dt><dd>${inline(g.v)}</dd></div>`).join('');
  document.getElementById('glance').hidden = !glance.length;
}
function buildFilters() {
  const counts = {};
  S.activity.forEach(e => counts[e.type] = (counts[e.type] || 0) + 1);
  const keys = Object.keys(TYPES).filter(k => counts[k]).concat(Object.keys(counts).filter(k => !TYPES[k]));
  const pill = (k, label, n) =>
    `<button class="pill${S.type === k ? ' active' : ''}" data-type="${k}" aria-pressed="${S.type === k}" style="--tc:${k === 'all' ? 'var(--muted)' : tc(k)}">` +
    `${k === 'all' ? '' : '<span class="dot"></span>'}${esc(label)} <span class="n">${n}</span></button>`;
  document.getElementById('filters').innerHTML =
    pill('all', 'All', S.activity.length) + keys.map(k => pill(k, typeLabel(k), counts[k])).join('');
}
function card(e) {
  const initials = typeLabel(e.type).split(' ').map(w => w[0]).join('').toUpperCase();
  const media = e.image
    ? `<div class="card-media"><img src="${esc(e.image)}" alt="" loading="lazy"></div>`
    : `<div class="card-media empty" aria-hidden="true"><span>${esc(initials)}</span></div>`;
  const meta = Object.entries(e.meta).filter(([k]) => !['format','price'].includes(k))
    .map(([k, v]) => `${esc(k[0].toUpperCase() + k.slice(1))}: ${inline(v)}`).join(' · ');
  return `<article class="card" style="--tc:${tc(e.type)}">${media}<div class="card-body">
    <div class="card-top"><span class="badge">${esc(typeLabel(e.type))}</span>${e.sample ? '<span class="badge-sample">Sample</span>' : ''}<span class="date">${fmtDate(e.date)}</span></div>
    <h3>${inline(e.title)}</h3>
    ${meta ? `<div class="meta">${meta}</div>` : ''}
    <p class="desc">${e.desc.map(inline).join(' ')}</p>
    <div class="links">${e.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.text)} ↗</a>`).join('')}</div>
  </div></article>`;
}
function renderGrid() {
  const list = S.type === 'all' ? S.activity : S.activity.filter(e => e.type === S.type);
  const grid = document.getElementById('grid');
  grid.innerHTML = list.length ? list.slice(0, S.shown).map(card).join('')
    : '<p class="empty-note">Nothing here yet.</p>';
  document.getElementById('more-wrap').innerHTML = list.length > S.shown
    ? `<button class="btn ghost pill" id="more">Show more (${list.length - S.shown})</button>` : '';
  document.getElementById('act-count').textContent = `${S.activity.length} updates`;
}
function renderUpcoming() {
  const ul = document.getElementById('upcoming-list');
  ul.innerHTML = S.upcoming.length ? S.upcoming.map(e => {
    const meta = [e.meta.location, e.meta.format, e.meta.price].filter(Boolean).map(inline).join(' · ');
    const l = e.links[0];
    return `<li class="up-row">
      <div class="up-date"><span class="d">${e.date.getDate()}</span><span class="m">${MONTHS[e.date.getMonth()]} ${String(e.date.getFullYear()).slice(2)}</span></div>
      <div class="up-main"><h3>${inline(e.title)} ${e.sample ? '<span class="badge-sample">Sample</span>' : ''}</h3>
        ${meta ? `<div class="meta">${meta}</div>` : ''}<p class="desc">${e.desc.map(inline).join(' ')}</p></div>
      ${l ? `<a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.text)} ↗</a>` : ''}
    </li>`;
  }).join('') : '<li class="up-row"><p class="empty-note">New dates announced soon.</p></li>';
}
function renderPanel(id, eyebrow, title, p) {
  document.getElementById(id).innerHTML = `
    <p class="eyebrow">${eyebrow}</p><h2>${title}</h2>
    ${p.paras.map(x => `<p>${inline(x)}</p>`).join('')}
    <div class="actions">${p.links.map((l, i) =>
      `<a class="btn ${i ? 'ghost' : 'solid'}" href="${esc(l.url)}"${/^https?:/.test(l.url) ? ' target="_blank" rel="noopener"' : ''}>${esc(l.text)}</a>`).join('')}</div>`;
}
function render() {
  renderHero(); buildFilters(); renderGrid(); renderUpcoming();
  renderPanel('study', 'For prospective students', 'Study with us', S.page.study);
  renderPanel('work', 'For industry', 'Work with us', S.page.work);
  document.getElementById('foot').textContent = S.page.footer;
  document.getElementById('updated').textContent = S.updated ? `Updated ${S.updated}` : '';
}

// ── Events ───────────────────────────────────────────────
function wireEvents() {
  document.getElementById('filters').addEventListener('click', ev => {
    const b = ev.target.closest('[data-type]'); if (!b) return;
    S.type = b.dataset.type; S.shown = PAGE; buildFilters(); renderGrid();
  });
  document.getElementById('more-wrap').addEventListener('click', ev => {
    if (ev.target.closest('#more')) { S.shown += PAGE; renderGrid(); }
  });
}

function initShowcase(md, updated) {
  S.updated = updated || '';
  parse(md); render(); wireEvents();
}
